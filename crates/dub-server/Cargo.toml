[package]
name = "dub-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "axum-сервер Dub Studio: тот же REST/SSE контракт, что backend/app.py"

[dependencies]
dub-core = { path = "../dub-core" }
dub-asr = { path = "../dub-asr" }
dub-llm = { path = "../dub-llm" }
dub-translate = { path = "../dub-translate" }
dub-sep = { path = "../dub-sep" }
dub-captions = { path = "../dub-captions" }
dub-ocr = { path = "../dub-ocr" }
audiocpp = { path = "../audiocpp" }
hound = "3"
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tokio = { workspace = true }
tokio-stream = "0.1"
futures-util = "0.3"
async-stream = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
mime_guess = "2"
# setup-автозакачка: HTTPS-загрузка компонентов (rustls, без системного OpenSSL) + распаковка zip/wheel.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "3", default-features = false, features = ["deflate"] }
# монитор ресурсов: GPU через NVML, RAM/CPU через sysinfo.
nvml-wrapper = "0.10"
sysinfo = "0.32"
# запись голоса с микрофона (нативный cpal + hound-WAV).
cpal = "0.15"
# нативный диалог выбора папки (импорт готовых моделей без докачки; на Windows — Win32, без GTK).
rfd = "0.15"
