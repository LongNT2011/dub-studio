[package]
name = "dub-studio-desktop"
version = "3.0.2"
edition = "2021"
description = "Tauri-оболочка Dub Studio: поднимает dub-server на 127.0.0.1:<рандомный порт> и открывает окно"

[lib]
name = "dub_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"   # авто-обновление: качает подписанный NSIS с GitHub-релиза, ставит в один клик
tauri-plugin-dialog = "2"    # нативный диалог «Обновить? [Обновить] [Позже]»
tauri-plugin-opener = "2"    # открыть страницу релиза (портатив) — замена устаревшего shell.open
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# axum-бэкенд встроен В ЭТОТ ЖЕ процесс (один exe, без dub-server.exe-сайдкара): serve_blocking с фонового потока.
dub-server = { path = "../../crates/dub-server" }
